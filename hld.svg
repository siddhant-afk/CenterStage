<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Edges -->
  <g stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- API Gateway -> Content Service -->
    <path d="M 304 90 L 130 90 L 130 160"/>
    <!-- API Gateway -> Video Service -->
    <path d="M 414 120 L 414 160"/>
    <!-- API Gateway -> Streaming Service -->
    <path d="M 524 90 L 690 90 L 690 160"/>
    <!-- Content Service -> DB -->
    <path d="M 95 220 L 85 250"/>
    <!-- Video Service -> Kafka -->
    <path d="M 414 220 L 414 260"/>
    <!-- Streaming Service -> AWS S3 -->
    <path d="M 690 220 L 690 400 L 524 480"/>
    <!-- Kafka -> Encoding Service -->
    <path d="M 414 320 L 414 370"/>
    <!-- Content Service -> AWS S3 -->
    <path d="M 130 220 L 130 400 L 304 480"/>
    <!-- Encoding Service -> AWS S3 -->
    <path d="M 414 430 L 414 480"/>
  </g>

  <!-- API Gateway -->
  <rect x="304" y="60" width="220" height="60" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="414" y="95" text-anchor="middle" font-size="14" font-weight="600">API Gateway</text>

  <!-- Content Service -->
  <rect x="60" y="160" width="140" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="130" y="184" text-anchor="middle" font-size="13" font-weight="600">Content Service</text>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#333">(movie/show catalog)</text>

  <!-- Video Service -->
  <rect x="344" y="160" width="140" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="414" y="184" text-anchor="middle" font-size="13" font-weight="600">Video Service</text>
  <text x="414" y="200" text-anchor="middle" font-size="11" fill="#333">(upload + S3)</text>

  <!-- Streaming Service -->
  <rect x="620" y="160" width="140" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="690" y="184" text-anchor="middle" font-size="13" font-weight="600">Streaming Service</text>
  <text x="690" y="200" text-anchor="middle" font-size="11" fill="#333">(HLS Playback)</text>

  <!-- Kafka -->
  <rect x="354" y="260" width="120" height="60" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="414" y="284" text-anchor="middle" font-size="13" font-weight="600">Kafka</text>
  <text x="414" y="300" text-anchor="middle" font-size="11" fill="#333">(Video uploaded)</text>

  <!-- Encoding Service -->
  <rect x="354" y="370" width="120" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="414" y="394" text-anchor="middle" font-size="13" font-weight="600">Encoding Service</text>
  <text x="414" y="410" text-anchor="middle" font-size="11" fill="#333">(FFmpeg)</text>

  <!-- AWS S3 -->
  <rect x="304" y="480" width="220" height="60" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="414" y="504" text-anchor="middle" font-size="13" font-weight="600">AWS S3</text>
  <text x="414" y="520" text-anchor="middle" font-size="11" fill="#333">(Video Storage)</text>

  <!-- DB cylinder -->
  <g>
    <path d="M 55 262 a 30 12 0 0 1 60 0 v 56 a 30 12 0 0 1 -60 0 z" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <ellipse cx="85" cy="262" rx="30" ry="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="85" y="300" text-anchor="middle" font-size="12" font-weight="600">DB</text>
  </g>
  <text x="85" y="365" text-anchor="middle" font-size="11" fill="#333">Content Metadata</text>

</svg>
